function sampleLit(mat) { const r = WORLD.renderer, sc = new THREE.Scene(); sc.add(new THREE.AmbientLight(0xffffff, .6)); const dl = new THREE.DirectionalLight(0xffffff, 1.2); dl.position.set(1, 2, 3); sc.add(dl); sc.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat)); const cam = new THREE.PerspectiveCamera(40, 1, .1, 10); cam.position.z = 2.2; const rt = new THREE.WebGLRenderTarget(16, 16), prev = r.getRenderTarget(), pc = r.getClearColor(new THREE.Color()), pa = r.getClearAlpha(); r.setRenderTarget(rt); r.setClearColor(0, 1); r.clear(); r.render(sc, cam); const px = new Uint8Array(1024); r.readRenderTargetPixels(rt, 0, 0, 16, 16, px); r.setRenderTarget(prev); r.setClearColor(pc, pa); rt.dispose(); let s = 0; for (let i = 0; i < px.length; i += 4) s += px[i] + px[i + 1] + px[i + 2]; return s / 768; }

  if (level >= 1) WORLD.scene.traverse(o => { const m = o.material; (Array.isArray(m) ? m : [m]).forEach(mm => { if (mm && (mm.bumpMap || mm.normalMap)) { mm.bumpMap = null; mm.normalMap = null; mm.needsUpdate = true; } }); }); WORLD.safeLevel = level; }

function failGL(e) { console.warn('WebGL unavailable', e); document.body.classList.add('nogl'); document.body.classList.remove('intro'); $('#skip').classList.add('hidden'); $('#term').classList.add('out'); buildDOM(); ['#hero', '#chip'].forEach(s => $(s).classList.remove('hidden')); }

  setupBer(geo); runSelfTest();
  try { if (THREE.EffectComposer && THREE.UnrealBloomPass) { const rt = new THREE.WebGLRenderTarget(innerWidth * ENV.pr, innerHeight * ENV.pr, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.UnsignedByteType });
